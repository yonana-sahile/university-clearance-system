services:
  db:
    image: postgres:16-alpine
    container_name: ucs_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clearance_db
      POSTGRES_USER: clearance_user
      POSTGRES_PASSWORD: clearance_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearance_user -d clearance_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ucs_net

  backend:
    build:
      context: ./clearance_backend
      dockerfile: Dockerfile
    container_name: ucs_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: change-me-in-production-1234567890
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,0.0.0.0
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      USE_POSTGRES: "True"
      DB_NAME: clearance_db
      DB_USER: clearance_user
      DB_PASSWORD: clearance_pass
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - ./clearance_backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    networks:
      - ucs_net

volumes:
  postgres_data:
  media_data:

networks:
  ucs_net:
    driver: bridge
